<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      padding: 20px; 
      background-color: #f0f0f0;
    }
    textarea { 
      width: 100%; 
      height: 150px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      padding: 10px;
      margin-bottom: 10px;
      font-family: monospace;
      resize: none;
    }
    .settings {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
      font-size: 13px;
      color: #333;
      background: white;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    input[type="number"] {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 60px;
    }
    button {
      background-color: #18A0FB; /* Figma Blue */
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 14px;
    }
    button:hover { background-color: #0D8DE3; }
    h2 { margin-top: 0; font-size: 18px; font-weight: 600; }
    p { font-size: 12px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>Table Vibe 🪄</h2>
  <p>Paste your table (Markdown, CSV, or Excel) below:</p>
  <textarea id="input" placeholder="Paste here..."></textarea>
  
  <div class="settings">
    <label for="fontSize">Font Size (px):</label>
    <input type="number" id="fontSize" value="14" min="8" max="72">
  </div>

  <button id="create">Create Figma Table</button>

  <script>
    document.getElementById('create').onclick = () => {
      const text = document.getElementById('input').value;
      const fontSize = document.getElementById('fontSize').value;
      
      // Send text AND font size to code.js
      parent.postMessage({ 
        pluginMessage: { 
          type: 'create-table', 
          text: text,
          fontSize: parseInt(fontSize) 
        } 
      }, '*');
    }
  </script>
</body>
</html>
